  <title>EcoMétrica</title>
  <script>
    (() => {
      const params = new URLSearchParams(location.hash.slice(1));
      if (params.get("error") || params.get("error_code")) {
        window.__ECOMETRICA_OAUTH_ERROR = {
          code: params.get("error_code") || params.get("error"),
          description: params.get("error_description") || "O Google não concluiu a autenticação."
        };
        history.replaceState(null, "", `${location.pathname}${location.search}#/login`);
        return;
      }
      if (!params.get("access_token") || !params.get("refresh_token")) return;
      window.__ECOMETRICA_OAUTH = {
        access_token: params.get("access_token"),
        refresh_token: params.get("refresh_token")
      };
      history.replaceState(null, "", `${location.pathname}${location.search}#/auth-callback`);
    })();
  </script>
